# Lab config for the Unbound guide: loopback only, port 18086.
server:
    verbosity: 1
    num-threads: 1
    interface: 127.0.0.1
    port: 18086
    do-ip6: no
    do-daemonize: yes
    use-syslog: no
    chroot: ""
    username: ""
    directory: "/home/hatch/workspace/unbound-labwork"
    pidfile: "/home/hatch/workspace/unbound-labwork/unbound.pid"
    logfile: "/home/hatch/workspace/unbound-labwork/unbound.log"

    tcp-upstream: yes
    root-hints: "/home/hatch/workspace/unbound-labwork/root/usr/share/dns/root.hints"
    auto-trust-anchor-file: "/home/hatch/workspace/unbound-labwork/root.key"
    domain-insecure: "lab"
    do-not-query-localhost: no

    access-control: 127.0.0.0/8 allow

    prefetch: yes
    serve-expired: yes

    local-zone: "home.arpa." static
    local-data: 'printer.home.arpa. 3600 IN A 192.168.1.50'
    local-data: 'nas.home.arpa. 3600 IN A 192.168.1.60'
    local-data-ptr: '192.168.1.50 3600 printer.home.arpa.'

    local-zone: "example.internal." static
    local-data: 'wiki.example.internal. 3600 IN A 192.168.1.70'

    local-zone: "ads.example." refuse

remote-control:
    control-enable: yes
    control-interface: "/home/hatch/workspace/unbound-labwork/control.sock"
    control-use-cert: no

forward-zone:
    name: "lab"
    forward-addr: 127.0.0.1@18087
